#CI项目
name: QCA-ALL

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  #⚠ 已用注释停用，不再删除，方便以后按需整段恢复。
  #停用原因：Auto-Clean 一跑完就会把四条产品线一起拉起（共 9 个固件同时在编），
  #   而它自己又会反过来把上一次的运行记录和 Release 删光，报错日志没法回溯。
  #   只要 Auto-Clean 不自动跑，这条链路就不会被激活 —— 所以真正的开关在 Auto-Clean。
  #   这里一并注释掉，是为了防止以后手动跑 Auto-Clean 时又被级联一次。
  #日常用法：Actions → QCA-ALL → Run workflow，一次同时出亚瑟 + M2 两个固件。
  #需要恢复：把下面四行行首的 # 去掉。
  #workflow_run:
  #  workflows: ["Auto-Clean"]
  #  types:
  #    - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        # IPQ60XX-JDCLOUD          = 京东云亚瑟 RE-SS-01（硬改1G，带WiFi）
        # IPQ60XX-ZNM2-WIFI-NO     = 兆能 ZN-M2（512MB + 128MB NAND，无WiFi）
        #   注意：名字里必须同时带 WIFI 和 NO，Settings.sh 靠这个判断要不要切
        #   ipq6018-nowifi.dtsi（给 NSS 少预留内存，512MB 机型很关键）
        CONFIG: [IPQ60XX-JDCLOUD, IPQ60XX-ZNM2-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
