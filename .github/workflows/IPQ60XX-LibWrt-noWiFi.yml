#CI项目
name: IPQ60XX-LibWRT-noWiFi

#CI计划
on:
  #仅手动编译（已关闭所有自动触发）
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        # 无 WiFi 的 IPQ60XX 设备（当前：兆能 ZN-M2）
        CONFIG: [IPQ60XX-noWiFi]
        # LiBwrt 官方库，25.12-nss 分支 = 6.12 内核 + 满血 NSS
        SOURCE: [LiBwrt/LibWrt]
        BRANCH: [25.12-nss]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: ZNM2
      #默认WIFI名称（无 WiFi 机型，仅占位）
      WRT_SSID: ZNM2
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址：与带 WiFi 那台错开，避免同网并存时 IP 冲突
      WRT_IP: 192.168.11.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
