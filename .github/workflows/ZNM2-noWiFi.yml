#CI项目：兆能 ZN-M2 —— 无 WiFi 版（512MB RAM + 128MB NAND，本机型无无线）
#CI源码：运行时用 SOURCE 下拉框选 OWrt（ImmortalWrt main / 6.18）或 LibWrt（25.12-nss / 6.12），一次只出一个固件
#CI粒度：一条工作流 = 一份设备配置；源码线在运行时手动选，不做矩阵展开
name: ZNM2-noWiFi

#CI计划
on:
  #仅手动编译（已关闭所有自动触发）
  workflow_dispatch:
    inputs:
      SOURCE:
        description: '选择源码线：一次运行只编译这一个源码线的固件。两条线都要就手动再跑一次。'
        default: 'OWrt'
        required: true
        type: choice
        options:
          #OWrt   = VIKINGYFY/immortalwrt 分支 main       （内核 6.18，主机名 OWrt   / 192.168.10.1）
          #LibWrt = LiBwrt/LibWrt        分支 25.12-nss  （内核 6.12，主机名 LibWrt / 192.168.20.1）
          #分支 / 仓库 / 主机名 / IP 全部由这个选项自动带出，不需要再手填
          - OWrt
          - LibWrt
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  wrt:
    #job 名带上源码线，Actions 里一眼看出这次跑的是哪条线
    name: 兆能 ZN-M2 无WiFi · ${{inputs.SOURCE}}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置（对应 Config/ZNM2-noWiFi.txt）
      WRT_CONFIG: ZNM2-noWiFi
      #默认主题
      WRT_THEME: argon
      #默认主机名：直接用源码线名（OWrt / LibWrt）
      WRT_NAME: ${{inputs.SOURCE}}
      #默认WIFI名称（无 WiFi 版用不到，WRT-CORE 里该字段必填所以照样传）
      WRT_SSID: ${{inputs.SOURCE}}
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址：OWrt 线 10.x、LibWrt 线 20.x，两条线的固件在同一网络里不会撞 IP
      WRT_IP: ${{inputs.SOURCE == 'LibWrt' && '192.168.20.1' || '192.168.10.1'}}
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: ${{inputs.SOURCE == 'LibWrt' && 'https://github.com/LiBwrt/LibWrt.git' || 'https://github.com/VIKINGYFY/immortalwrt.git'}}
      #源码分支
      WRT_BRANCH: ${{inputs.SOURCE == 'LibWrt' && '25.12-nss' || 'main'}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE == 'LibWrt' && 'LiBwrt/LibWrt' || 'VIKINGYFY/immortalwrt'}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
