#CI项目
name: WRT-TEST

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        default: 'JDCloud-WiFi'
        required: true
        type: choice
        options:
          #只留本仓库实际维护的配置，已删除的机型配置不再出现在下拉里
          - JDCloud-WiFi
          - JDCloud-noWiFi
          - ZNM2-noWiFi
          - TEST
      SOURCE:
        description: '选择源码线（与三条正式工作流同一套下拉框）'
        default: 'OWrt'
        required: true
        type: choice
        options:
          #OWrt   = VIKINGYFY/immortalwrt 分支 main       （内核 6.18，主机名 OWrt   / 192.168.10.1）
          #LibWrt = LiBwrt/LibWrt        分支 25.12-nss  （内核 6.12，主机名 LibWrt / 192.168.20.1）
          - OWrt
          - LibWrt
      #★这里曾经有个 BRANCH 输入框，已删除 —— 不要再加回来：
      #GitHub 的 workflow_dispatch 表单不支持联动，选 SOURCE 不会让 BRANCH 自动填值，
      #而浏览器会 autofill 成旧默认值 main。一旦 BRANCH 非空，表达式就会优先用它，
      #结果是「选了 LibWrt 却去拉 main 分支」—— 拉不到，或者拉到非 NSS 的版本。
      #分支与源码线强绑定，交给 SOURCE 带出即可；真要临时测别的分支，改下面
      #WRT_BRANCH 那一行。
      PACKAGE:
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        #必须是布尔字面量：WRT-CORE 的 WRT_TEST 是 boolean，写成 'true' 字符串
        #会被判为真值之外的语义，导致本工作流真的去编译固件
        default: true
        required: true
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{inputs.CONFIG}} · ${{inputs.SOURCE}}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名：直接用源码线名（OWrt / LibWrt）
      WRT_NAME: ${{inputs.SOURCE}}
      #默认WIFI名称
      WRT_SSID: ${{inputs.SOURCE}}
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址：OWrt 线 10.x、LibWrt 线 20.x
      WRT_IP: ${{inputs.SOURCE == 'LibWrt' && '192.168.20.1' || '192.168.10.1'}}
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: ${{inputs.SOURCE == 'LibWrt' && 'https://github.com/LiBwrt/LibWrt.git' || 'https://github.com/VIKINGYFY/immortalwrt.git'}}
      #源码分支：完全由 SOURCE 带出（OWrt→main、LibWrt→25.12-nss），不接受手填
      WRT_BRANCH: ${{inputs.SOURCE == 'LibWrt' && '25.12-nss' || 'main'}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE == 'LibWrt' && 'LiBwrt/LibWrt' || 'VIKINGYFY/immortalwrt'}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      #inputs.TEST 为空（workflow_run 触发时）兜底为 false，避免把空串传给 boolean 入参
      WRT_TEST: ${{inputs.TEST || false}}
