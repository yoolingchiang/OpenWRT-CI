#CI项目
name: WRT-TEST

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        default: 'IPQ60XX'
        required: true
        type: choice
        options:
          #只留本仓库实际维护的配置，已删除的机型配置不再出现在下拉里
          - IPQ60XX
          - IPQ60XX-noWiFi
          - TEST
      SOURCE:
        default: 'VIKINGYFY/immortalwrt'
        required: true
        type: choice
        options:
          #与四条正式工作流对齐，只留这两个源
          - VIKINGYFY/immortalwrt
          - LiBwrt/LibWrt
      BRANCH:
        #选 LiBwrt/LibWrt 时这里要手改成 25.12-nss，否则拉不到分支
        default: 'main'
        required: true
        type: string
      PACKAGE:
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        #必须是布尔字面量：WRT-CORE 的 WRT_TEST 是 boolean，写成 'true' 字符串
        #会被判为真值之外的语义，导致本工作流真的去编译固件
        default: true
        required: true
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{inputs.CONFIG}}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      #默认主题
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      #inputs.TEST 为空（workflow_run 触发时）兜底为 false，避免把空串传给 boolean 入参
      WRT_TEST: ${{inputs.TEST || false}}
